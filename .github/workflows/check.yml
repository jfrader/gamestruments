name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cargo test -p gamestruments-engine
      - run: cargo clippy -p gamestruments-engine --all-targets -- -D warnings
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p gamestruments-engine --target wasm32-unknown-unknown --release
      - run: cp target/wasm32-unknown-unknown/release/gamestruments_engine.wasm apps/demo/public/engine/gamestruments_engine.wasm
      - run: git diff --exit-code -- apps/demo/public/engine/gamestruments_engine.wasm
      - run: cargo run -p gamestruments-engine --example parity_ref --release
      - run: node tests/wasm-parity.mjs
