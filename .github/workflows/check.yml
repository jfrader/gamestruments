name: check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.94.0"
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: cargo test -p gamestruments-engine --locked
      # regression ceiling for production render cost runs here (release mode)
      - run: cargo test -p gamestruments-engine --release realtime_render_benchmark -- --ignored --nocapture --test-threads=1
      - run: cargo clippy -p gamestruments-engine --all-targets --locked -- -D warnings
      - run: cargo check -p gamestruments-godot --locked
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p gamestruments-engine --target wasm32-unknown-unknown --release --locked
      - run: npm run wasm:verify
      - run: cargo run -p gamestruments-engine --example parity_ref --release --locked
      - run: node tests/wasm-parity.mjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Run browser e2e in the matching Playwright container
        run: |
          version=$(node -e 'const v=require("./package-lock.json").packages["node_modules/@playwright/test"].version; if(!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1); process.stdout.write(v)')
          docker run --rm --init --shm-size=1g \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            -w /work "mcr.microsoft.com/playwright:v$version-noble" \
            bash -c 'npm ci --no-audit --no-fund && npm run test:e2e'
  godot:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_RELEASE_BASE: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.94.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: cargo build -p gamestruments-godot --release --locked
      - name: Download verified Godot
        run: |
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSLO "$GODOT_RELEASE_BASE/$archive"
          curl -fsSLO "$GODOT_RELEASE_BASE/SHA512-SUMS.txt"
          expected="$(tr -d '\r' < SHA512-SUMS.txt | awk -v f="$archive" '$2 == f { print $1 }')"
          if [[ ! "$expected" =~ ^[0-9a-fA-F]{128}$ ]]; then
            echo "ERROR: missing SHA-512 entry for $archive" >&2
            exit 1
          fi
          actual="$(sha512sum "$archive" | awk '{ print $1 }')"
          if [[ "${actual,,}" != "${expected,,}" ]]; then
            echo "ERROR: SHA-512 mismatch for $archive" >&2
            exit 1
          fi
          unzip -q "$archive" -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$PWD/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - run: node tests/godot-package-smoke.mjs --godot "$GODOT_BIN" --library target/release/libgamestruments_godot.so
      - name: Verify package structure and source rebuild
        run: |
          mkdir -p release-assets dist
          node tests/create-native-library-fixtures.mjs release-assets
          GAMESTRUMENTS_PROVENANCE=local tools/package_kit.sh --version 0.1.0-ci --assets-dir release-assets --out-dir dist
          tools/verify_kit_archive.sh dist/gamestruments-0.1.0-ci-godot4.zip
